# Eenmalig: haalt de beelden van de oude WordPress-site (fierdesign.nl) op en zet ze in assets/wp/.
# Start automatisch zodra _bron/oude-beelden.txt wordt gewijzigd, of handmatig via Actions.
name: Beelden van oude site ophalen
on:
  push:
    branches: [main]
    paths: ["_bron/oude-beelden.txt", ".github/workflows/beelden-ophalen.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Downloaden en verkleinen
        run: |
          pip install --quiet pillow
          python3 - <<'PY'
          import os, urllib.request, io
          from PIL import Image
          base = "https://fierdesign.nl/wp-content/uploads/"
          mis = []
          for rel in open("_bron/oude-beelden.txt").read().split():
              doel = os.path.join("assets/wp", rel)
              if os.path.exists(doel):
                  continue
              os.makedirs(os.path.dirname(doel), exist_ok=True)
              try:
                  req = urllib.request.Request(base + rel, headers={"User-Agent": "Mozilla/5.0 (fierdesign-migratie)"})
                  data = urllib.request.urlopen(req, timeout=60).read()
              except Exception as ex:
                  mis.append(f"{rel}  {ex}")
                  continue
              ext = rel.lower().rsplit(".", 1)[-1]
              if ext in ("jpg", "jpeg") and len(data) > 600_000:
                  im = Image.open(io.BytesIO(data))
                  im = im.convert("RGB")
                  im.thumbnail((2400, 2400))
                  im.save(doel, "JPEG", quality=85, optimize=True, progressive=True)
              else:
                  open(doel, "wb").write(data)
          open("assets/wp/ontbreekt.txt", "w").write("\n".join(mis) + ("\n" if mis else ""))
          print("ontbrekend:", len(mis))
          print("\n".join(mis))
          PY
          du -sh assets/wp; find assets/wp -type f | wc -l
      - name: Vastleggen
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add assets/wp
          git diff --cached --quiet || git commit -m "Beelden van de oude site overgezet naar assets/wp"
          git pull --rebase origin main
          git push origin HEAD:main
